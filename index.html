<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sam's Retro Skater</title>
  <meta name="description" content="A pixel-art skater endless runner. The weather gets worse the longer you survive." />
  <meta name="color-scheme" content="light dark" />
  <link rel="canonical" href="https://sgxwrk.github.io/sams-retro-skater/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sam’s Retro Skater" />
  <meta property="og:title" content="Sam’s Retro Skater" />
  <meta property="og:description" content="Pixel-art skater endless runner. The weather turns from sun to snow to thunderstorm the longer you survive." />
  <meta property="og:url" content="https://sgxwrk.github.io/sams-retro-skater/" />
  <meta property="og:image" content="https://sgxwrk.github.io/sams-retro-skater/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Pixel-art skater jumping over a bench and two cones in the snow, title Sam’s Retro Skater." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sam’s Retro Skater" />
  <meta name="twitter:description" content="Pixel-art skater endless runner. The weather turns from sun to snow to thunderstorm the longer you survive." />
  <meta name="twitter:image" content="https://sgxwrk.github.io/sams-retro-skater/og-image.png" />
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #020202; --fg: #f5f5f2; --muted: #8a8a85; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Pixelify Sans", ui-monospace, monospace; line-height: 1.5; }
    main { max-width: 1100px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1 { font-size: clamp(2.25rem, 7vw, 4.5rem); font-weight: 500; line-height: 1; margin: 0 0 1rem; }
    p.lead { color: var(--muted); max-width: 34rem; margin: 0 0 2.5rem; font-size: 1.125rem; }
    sams-retro-skater { max-width: 800px; }
    footer { margin-top: 2rem; color: var(--muted); font-size: .875rem; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Sam's Retro Skater.</h1>
    <p class="lead">Jump with space, click or tap. The longer you survive, the faster it gets, and the weather turns: sun, clouds, snow, rain, thunderstorm.</p>
    <sams-retro-skater></sams-retro-skater>
    <footer>Font: Pixelify Sans (OFL). Dependency-free web component, MIT licensed.</footer>
  </main>
  <script type="module" src="./src/runner-game.js"></script>
</body>
</html>
